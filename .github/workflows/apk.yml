name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  KEYSTORE_FILE: ${{ runner.temp }}/release.jks
  KEYSTORE_PASSWORD: adbweb
  KEY_ALIAS: adbweb
  KEY_PASSWORD: adbweb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Generate release keystore
        run: keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -keyalg RSA -keysize 2048 -validity 10000 -alias adbweb -storepass adbweb -keypass adbweb -dname "CN=adbweb, OU=adbweb, O=adbweb, C=CN"

      - name: Build Debug and Release APK
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: '8.9'
          arguments: assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-web-cast-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-web-cast-release
          path: android/app/build/outputs/apk/release/app-release.apk
