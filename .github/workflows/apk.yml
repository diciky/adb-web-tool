name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: adbweb
      KEY_ALIAS: adbweb
      KEY_PASSWORD: adbweb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Generate release keystore
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias adbweb -storepass adbweb -keypass adbweb -dname "CN=adbweb, OU=adbweb, O=adbweb, C=CN"

      - name: Build Debug and Release APK
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: '8.9'
          arguments: assembleDebug assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-web-cast-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-web-cast-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: 持续构建 (Continuous)
          prerelease: true
          body: |
            自动构建的安卓TV投屏 APK（调试版与发布版）。
            调试版：app-debug.apk；发布版：app-release.apk（CI 临时签名）。
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
