name: Build IPA (unsigned)

# 在 GitHub 托管的 macOS runner 上把 iOS 壳编译成未签名 IPA。
# 未签名 IPA 不需要 Apple 开发者账号 / 证书 / 描述文件，
# 用 Sideloadly / AltStore / 爱思助手等自签后即可安装。
# 触发：push 到 main/master、手动、或推送 v* 标签（发布到 Release）。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: AdbWebCast
  PROJECT: ios/AdbWebCast/AdbWebCast.xcodeproj
  IPA_NAME: AdbWebCast-ios.ipa

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: 静态校验 iOS 工程
        run: node ios/scripts/check-ios-project.mjs

      - name: 归档（无签名）
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/AdbWebCast.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 组装未签名 IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AdbWebCast.xcarchive/Products/Applications/AdbWebCast.app"
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          echo "IPA 已生成: $(ls -lh "$GITHUB_WORKSPACE/$IPA_NAME")"
          file "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: 上传 IPA（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: adbtv-ios-unsigned
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: 发布到 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ADB TV 助手 iOS ${{ github.ref_name }}
          body: |
            v2.2.0 — 修复 ADB 通道流控（CLSE 未回 OKAY 导致残留帧污染，设备信息全空/文件超时/列表错位），
            并补齐设备记忆、独立遥控页、截图预览与实时屏幕。最低支持 iOS 16.0，完全独立不依赖 Web。

            本次修复与新增：
            - 【核心】ADB 通道关闭时正确回 OKAY，open 容错跳过残留帧：设备信息、文件、应用列表恢复正常
            - 设备记忆：连过一次的电视永久保存（IP + 型号），下次打开直接显示可点直连；长按可改名/忘记
            - 内置固定 RSA 密钥：电视勾选「一律允许」后免重复授权
            - 遥控独立页：实体遥控器布局（十字方向键 + OK + 音量 + 播放 + 数字键），方向键/音量长按连发
            - 屏幕页：截图直接在 App 内预览并可保存相册；「实时屏幕」循环抓帧近实时查看电视画面
            - 工具箱精简：屏幕/电源/文字输入/剪贴板/Shell 命令

            设备发现（3 种）：
            - 自动扫描本机 WiFi/以太网网段的 5555 端口（已过滤 VPN/蜂窝虚拟网卡）
            - 手动输入网段（如 10.10.10）
            - 直接输入电视 IP 连接
            扫描会对每个开放端口做真正的 ADB 握手验证，杜绝误报。

            8 项原生功能 Tab：设备、应用、安装 APK、文件传输、遥控、自启管理、批量操作、工具箱。

            首次连接请在电视上勾选「一律允许 / 始终允许」。
            安装：未签名 IPA，需用 Sideloadly / AltStore / 爱思助手自签后安装。
            首次使用弹出「查找本地网络设备」权限请点允许。
          files: ${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
