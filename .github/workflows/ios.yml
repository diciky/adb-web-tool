name: Build IPA (unsigned)

# 在 GitHub 托管的 macOS runner 上把 iOS 壳编译成未签名 IPA。
# 未签名 IPA 不需要 Apple 开发者账号 / 证书 / 描述文件，
# 用 Sideloadly / AltStore / 爱思助手等自签后即可安装。
# 触发：push 到 main/master、手动、或推送 v* 标签（发布到 Release）。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: AdbWebCast
  PROJECT: ios/AdbWebCast/AdbWebCast.xcodeproj
  IPA_NAME: AdbWebCast-ios.ipa

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: 静态校验 iOS 工程
        run: node ios/scripts/check-ios-project.mjs

      - name: 归档（无签名）
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/AdbWebCast.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 组装未签名 IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AdbWebCast.xcarchive/Products/Applications/AdbWebCast.app"
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          echo "IPA 已生成: $(ls -lh "$GITHUB_WORKSPACE/$IPA_NAME")"
          file "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: 上传 IPA（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: adbtv-ios-unsigned
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: 发布到 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ADB TV 助手 iOS ${{ github.ref_name }}
          body: |
            完全独立的原生 iOS 客户端，**不依赖任何 Web 服务 / 电脑**。最低支持 iOS 16.0。

            设备发现（3 种）：
            - 自动扫描本机 WiFi/以太网网段的 5555 端口（已过滤 VPN/蜂窝虚拟网卡）
            - 手动输入网段（如 10.10.10）
            - 直接输入电视 IP 连接
            扫描会对每个开放端口做真正的 ADB 握手验证，杜绝误报。

            7 项原生功能：
            - 设备信息：型号/品牌/Android 版本/分辨率/电量/ADB 地址
            - 应用管理：列表、启动、强制停止、清除数据、启用/禁用、卸载
            - 安装 APK：原生 sync 推送 + pm install，实时进度
            - 文件传输：浏览目录、上传、下载、删除、新建文件夹
            - 自启管理：列出开机自启项并一键启用/禁用
            - 批量操作：重启/关机/息屏/清数据/卸载等可多选连续执行
            - 工具箱：截图、电源、遥控按键、文字输入、剪贴板、Shell 命令

            首次连接请在电视上勾选「一律允许 / 始终允许」。
            安装：未签名 IPA，需用 Sideloadly / AltStore / 爱思助手自签后安装。
            首次使用弹出「查找本地网络设备」权限请点允许。
          files: ${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
