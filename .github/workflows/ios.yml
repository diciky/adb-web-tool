name: Build IPA (unsigned)

# 在 GitHub 托管的 macOS runner 上把 iOS 壳编译成未签名 IPA。
# 未签名 IPA 不需要 Apple 开发者账号 / 证书 / 描述文件，
# 用 Sideloadly / AltStore / 爱思助手等自签后即可安装。
# 触发：push 到 main/master、手动、或推送 v* 标签（发布到 Release）。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: AdbWebCast
  PROJECT: ios/AdbWebCast/AdbWebCast.xcodeproj

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: 静态校验 iOS 工程
        run: node ios/scripts/check-ios-project.mjs

      - name: 生成带版本号的 IPA 文件名
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION = ' "$PROJECT/project.pbxproj" | sed -E 's/.*= ([0-9.]+);.*/\1/')
          echo "IPA_NAME=AdbWebCast-ios-v${VERSION}.ipa" >> "$GITHUB_ENV"
          echo "IPA 文件名: AdbWebCast-ios-v${VERSION}.ipa"

      - name: 归档（无签名）
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/AdbWebCast.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 组装未签名 IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AdbWebCast.xcarchive/Products/Applications/AdbWebCast.app"
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          echo "IPA 已生成: $(ls -lh "$GITHUB_WORKSPACE/$IPA_NAME")"
          file "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: 上传 IPA（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: adbtv-ios-unsigned
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: 发布到 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ADB TV 助手 iOS ${{ github.ref_name }}
          body: |
            ${{ github.ref_name }} — 独立原生 iOS 客户端，最低支持 iOS 16.0，不依赖 Web 服务。

            本次新增（v3.7.1）：
            - 【商业化】新增 Pro 权益：StoreKit 2 支持月度订阅 / 年度订阅 / 永久解锁，含恢复购买与交易监听；¥6/月、¥9/年（7 天试用）、¥30 永久，商品需在 App Store Connect 配置后生效
            - 【Pro 截屏】截图历史（按设备留存、可分享/删除）、OCR 本地识别取字、截图标注（红蓝绿画笔、保存回历史与相册）
            - 【Pro 设备健康管理】健康历史落盘、CSV 报告导出、CPU/温度/存储阈值本地告警、性能评分；原「健康监控」已改名为「设备健康管理」
            - 设备页新增「Pro 权益」统一入口
            - 【修复】运行日志被 sync<DATA 刷屏：接收到每个 64KB 数据帧都打一行日志，一个大 APK（约 1500 帧）就把 1500 行日志缓冲区全部占满，把 RECV / 解析失败等诊断信息全部挤出，导致「日志里全是 sync<DATA、看不到错误」。DATA 帧不再逐帧打日志
            - 【修复】pull 可靠性：改为内存累积完整内容后原子写入，避免 FileHandle 逐帧写入吞 IO 错误、或断线重试时 createFile 不截断导致尾部残留旧数据、APK 损坏后静默解析失败
            - 【诊断】资源解析每个失败点（无路径/大小异常/读数据失败/Manifest 解析失败）都打 W 日志，成功时记录名称与图标，下次可精确定位
            - 【已本地验证】电视上全部 32 个用户应用 APK 拉取 + 名称解析 100% 成功（TiviMate / Emby / Twitch / 当贝市场 / 银河奇异果 / 柴柴emby 等中文名全对）
            - 【修复】自启管理真机为空：全量 dumpsys package 的输出没有 Package[xxx] 分段（实测 BRAVIA Android 9 为 0 段），旧版按段取包名导致恒空。改为直接解析 android.intent.action.BOOT_COMPLETED: 下的组件行（实测 81 个），并用 pm list packages -f 只保留 /data 用户应用（实测 20 项，与 Web 端一致），排除系统 Receiver 淹没列表
            - 【修复】应用图标：旧缓存里大量包只有名字没有图标且被永久跳过。缓存升 v3 强制重解析；资源表空条目（如 Twitch）增加包内图片启发式兜底；缺图标的包允许在重试期后补图标
            - 【修复】应用图标/中文名缓存：改为按包名持久化到 Application Support（原来图标放 Caches、名称按 APK 路径存键，后台回来图标被系统清理或跨页面查不到）。首屏直接读缓存，已解析应用不再重复拉 APK
            - 【修复】文字输入：真机验证后重写。英文走 input text；中文改为自动安装 ADBKeyBoard 输入助手 + ADB_INPUT_TEXT 广播（原 service call clipboard / 剪贴板粘贴在 Android 9 电视上静默失败，看似成功实则没输入）。首次发送中文会自动切换电视输入法并提示点一下输入框，之后长期有效
            - 健康监控：直连电视采集 CPU/内存曲线（2s 采样、保留 60 点）、存储、电量温度、WiFi，含 ping + ADB 推拉网络测速
            - 定时任务：本地保存间隔/Cron 任务，App 打开时按计划执行重启/关机/熄屏/唤醒/卸载/清数据/强停
            - 应用列表：明确切换「用户应用 / 系统应用」，每行显示应用图标；中文名逐个解析并即时刷新
            - 「输入文字 / 剪贴板」合并为一个入口：中文走剪贴板、英文可直输，支持手机剪贴板与历史记录
            - 内置 App Icon，补齐 Shell/应用/文件/遥控/自启/批量/日志等扁平功能入口

            如果桌面图标还是旧的：请卸载 App 后重新安装（iOS 会缓存主屏幕图标）。

            已具备能力：
            - ADB 局域网扫描 / IP 直连，一次授权长期复用
            - 设备信息、应用管理、APK 安装、文件传输、远程遥控、屏幕截图与实时预览
            - 电源操作、自启管理、批量操作、运行日志

            安装：未签名 IPA，需用 Sideloadly / AltStore / 爱思助手自签后安装。
            注意：当前是未签名构建，App Store Connect 中尚未配置 IAP 商品，Pro 购买页在自签版本里只展示「商品加载中」；上架签名版本并配置商品后即可购买。
            首次连接请在电视上勾选「一律允许 / 始终允许」；首次弹出「查找本地网络设备」请点允许。
          files: ${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
